name = "retrac-link"
main = "src/index.js"
compatibility_date = "2025-11-01"

# Serve the Worker on the apex domain. Cloudflare creates the DNS record for
# you as long as retrac.link is a zone on your Cloudflare account.
routes = [{ pattern = "retrac.link", custom_domain = true }]

# Create the database with:  npx wrangler d1 create retrac-link
# then paste the database_id it prints below. Tables are created automatically.
[[d1_databases]]
binding = "DB"
database_name = "retrac-link"
database_id = "32a5258b-4d81-4dff-8708-1adfc77d321b"

# DASHBOARD_PASSWORD is a secret, not a var. Set it in the Cloudflare dashboard
# (Workers & Pages → retrac-link → Settings → Variables and Secrets → Add → Secret)
# or with:  npx wrangler secret put DASHBOARD_PASSWORD
# For local development, put it in a .dev.vars file (see .dev.vars.example).

# Lets src/index.js import the favicon as an ArrayBuffer.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true
